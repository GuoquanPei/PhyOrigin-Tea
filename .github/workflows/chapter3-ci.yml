name: Chapter 3 CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install 'Pillow>=10.3' 'numpy>=1.26,<2' 'pycocotools>=2.0.8' 'PyYAML>=6'
      - name: Install deployment PyTorch API on CPU
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check Python and Bash files
        run: |
          python -m compileall -q chapter3_segmentation tests
          bash -n chapter3_segmentation/setup_sam3.sh
          bash -n chapter3_segmentation/run_server.sh
          bash chapter3_segmentation/setup_sam3.sh --help
          bash chapter3_segmentation/run_server.sh --help
      - name: Test data, metrics, geometry and server helpers
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test original SAM3 training configuration
        run: python -m unittest discover -s chapter3_segmentation/tests -p 'test_*.py' -v
